services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flow
      POSTGRES_PASSWORD: flow
      POSTGRES_DB: flow
    ports:
      - '5432:5432'
    volumes:
      - flow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flow -d flow']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  flow_pg:
